version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gerenciador_financas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2208
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./financas-backend/financas-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gerenciador_financas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2208
    depends_on:
      - postgres

  frontend:
    build: ./financas-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
